name: Visual Baselines

# Republishes the screenshot baselines outside a push to main — after a cache
# eviction, or a @playwright/test bump that re-renders text.
#
# Dispatch against `main`. A cache written from any other branch is scoped to
# that branch and no pull request will see it.
on:
  workflow_dispatch: {}

concurrency:
  group: visual-baselines
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Take and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A cache written anywhere else is scoped to that branch and no pull
      # request can restore it, so the run would be pure waste.
      - name: Refuse anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Dispatched against ${GITHUB_REF_NAME}. Baselines are only useful when published from main."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Playwright version
        id: pw
        run: echo "version=$(node apps/storybook/scripts/playwright-version.mjs)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
      - name: Take baselines
        run: pnpm run test:visual:update
      - name: Publish baselines
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/storybook/tests/visual/__screenshots__
          key: visual-baselines-${{ steps.pw.outputs.version }}-${{ github.sha }}
      - name: Keep a durable baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-baselines-${{ steps.pw.outputs.version }}
          path: apps/storybook/tests/visual/__screenshots__
          retention-days: 90
          if-no-files-found: error
      - name: Summary
        run: |
          {
            echo "## Visual baselines"
            echo ""
            echo "Published a fresh set from \`main\` at \`${GITHUB_SHA:0:7}\`."
          } >> "$GITHUB_STEP_SUMMARY"
