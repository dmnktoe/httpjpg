name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  NEXT_PUBLIC_APP_URL: https://httpjpg.com
  NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
  NEXT_PUBLIC_STORYBLOK_VERSION: published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # ── Skip the pipeline on release PRs (see CLAUDE.md → Releases) ─────
  guard:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Classify the ref
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" == release-please--* ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release PR ($HEAD_REF) — skipping CI, its commits already passed on main."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: [guard]
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm run lint
      - name: Validate Storyblok schema
        run: pnpm --filter @httpjpg/storyblok-sync validate:schema

  typecheck:
    name: TypeScript
    needs: [guard]
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm run type-check

  test:
    name: Unit Tests
    needs: [guard]
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm run test:ci
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          report_type: test_results
          fail_ci_if_error: false

  build-packages:
    name: Build Packages
    needs: [guard]
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm run build --filter="./packages/*"

  build-apps:
    name: Build Apps
    runs-on: ubuntu-latest
    needs: [build-packages]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [portfolio, storybook, studio]
    env:
      NEXT_PUBLIC_STORYBLOK_TOKEN: ${{ secrets.NEXT_PUBLIC_STORYBLOK_TOKEN }}
      STORYBLOK_PREVIEW_TOKEN: ${{ secrets.STORYBLOK_PREVIEW_TOKEN }}
      STORYBLOK_PREVIEW_SECRET: ${{ secrets.STORYBLOK_PREVIEW_SECRET }}
      STORYBLOK_REVALIDATE_SECRET: ${{ secrets.STORYBLOK_REVALIDATE_SECRET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      ARCJET_KEY: ${{ secrets.ARCJET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Build ${{ matrix.app }}
        run: pnpm run build --filter=@httpjpg/${{ matrix.app }}
      - name: Package build artifacts
        if: matrix.app == 'portfolio'
        run: tar -czf portfolio-build.tar.gz --exclude='.next/cache' -C apps/portfolio .next
      - name: Upload build artifacts
        if: matrix.app == 'portfolio'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portfolio-build
          path: portfolio-build.tar.gz
          retention-days: 1
      - name: Upload Sentry sourcemaps
        if: matrix.app == 'portfolio' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          pnpm --filter=@httpjpg/portfolio exec sentry-cli sourcemaps upload \
            --org=${{ secrets.SENTRY_ORG }} \
            --project=${{ secrets.SENTRY_PROJECT }} \
            --release=${{ github.sha }} \
            .next/static

  # ── Bundle analysis (Codecov, informational, not gated) ────────────
  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    needs: [build-packages]
    timeout-minutes: 20
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      NEXT_PUBLIC_STORYBLOK_TOKEN: ${{ secrets.NEXT_PUBLIC_STORYBLOK_TOKEN }}
      STORYBLOK_PREVIEW_TOKEN: ${{ secrets.STORYBLOK_PREVIEW_TOKEN }}
      STORYBLOK_PREVIEW_SECRET: ${{ secrets.STORYBLOK_PREVIEW_SECRET }}
      STORYBLOK_REVALIDATE_SECRET: ${{ secrets.STORYBLOK_REVALIDATE_SECRET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      ARCJET_KEY: ${{ secrets.ARCJET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Build with bundle stats and upload to Codecov
        run: pnpm --filter=@httpjpg/portfolio run build:analyze

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build-apps]
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_STORYBLOK_TOKEN: ${{ secrets.NEXT_PUBLIC_STORYBLOK_TOKEN }}
      STORYBLOK_PREVIEW_TOKEN: ${{ secrets.STORYBLOK_PREVIEW_TOKEN }}
      STORYBLOK_PREVIEW_SECRET: ${{ secrets.STORYBLOK_PREVIEW_SECRET }}
      STORYBLOK_REVALIDATE_SECRET: ${{ secrets.STORYBLOK_REVALIDATE_SECRET }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      ARCJET_KEY: ${{ secrets.ARCJET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: portfolio-build
      - name: Extract build artifacts
        run: |
          tar -xzf portfolio-build.tar.gz -C apps/portfolio
          cat apps/portfolio/.next/BUILD_ID
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter=@httpjpg/portfolio exec playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter=@httpjpg/portfolio exec playwright install-deps chromium
      - name: Run E2E tests
        run: pnpm --filter=@httpjpg/portfolio run test:e2e
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: apps/portfolio/playwright-report/
          retention-days: 30

  # ── Chromatic hosts the browsable Storybook; snapshots are off there ──
  chromatic:
    name: Publish Storybook
    needs: [guard]
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check for visual-relevant changes
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE"...HEAD | grep -qE '^(apps/storybook|packages/(ui|tokens|now-playing|spotify|consent|storyblok-richtext|storyblok-ui|storyblok-utils))/'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup
        if: steps.changes.outputs.relevant == 'true'
      - name: Publish to Chromatic
        if: steps.changes.outputs.relevant == 'true'
        uses: chromaui/action@14cfaef73576e69f95f47f60058063f46ca38719 # v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/storybook
          buildScriptName: build
          exitOnceUploaded: true

  # ── Visual regression: main publishes baselines, PRs compare ───────
  visual:
    name: Visual Regression
    needs: [guard]
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # This job holds a write-capable token and the API calls below pass it
          # explicitly; nothing needs it sitting in the local git config.
          persist-credentials: false
      - name: Check for visual-relevant changes
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE"...HEAD | grep -qE '^(apps/storybook|packages/(ui|tokens|now-playing|spotify|consent|storyblok-richtext|storyblok-ui|storyblok-utils))/'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore baselines
        id: restore
        if: github.event_name == 'pull_request' && steps.changes.outputs.relevant == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/storybook/tests/visual/__screenshots__
          key: visual-baselines-${{ github.sha }}
          restore-keys: visual-baselines-

      - uses: ./.github/actions/setup
        if: steps.changes.outputs.relevant == 'true'

      - name: Compare stories against main's baselines
        id: compare
        if: github.event_name == 'pull_request' && steps.restore.outputs.cache-matched-key != ''
        continue-on-error: true
        run: pnpm run test:visual

      - name: Report a missing baseline
        if: github.event_name == 'pull_request' && steps.changes.outputs.relevant == 'true' && steps.restore.outputs.cache-matched-key == ''
        run: |
          echo "::warning::No baseline cache to compare against — nothing has published one from main yet, or it was evicted. Dispatch the Visual Baselines workflow against main to restore it."

      - name: Take baselines
        if: github.event_name == 'push' && steps.changes.outputs.relevant == 'true'
        run: pnpm run test:visual:update

      - name: Publish baselines
        if: github.event_name == 'push' && steps.changes.outputs.relevant == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/storybook/tests/visual/__screenshots__
          key: visual-baselines-${{ github.sha }}

      - name: Upload diff report
        if: steps.compare.outcome == 'failure' || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-report
          path: |
            apps/storybook/playwright-report/
            apps/storybook/test-results/
          retention-days: 14

      - name: Comment with what moved
        if: steps.compare.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          BODY="$(node apps/storybook/scripts/visual-summary.mjs apps/storybook/visual-results.json)"
          ISSUE="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues"

          EXISTING="$(curl --fail-with-body -sS -H "Authorization: Bearer $GH_TOKEN" \
            "$ISSUE/$PR/comments?per_page=100" \
            | jq -r 'map(select(.body | startswith("<!-- visual-regression -->"))) | last | .id // empty')"

          if [[ -n "$EXISTING" ]]; then
            METHOD=PATCH
            URL="$ISSUE/comments/$EXISTING"
          else
            METHOD=POST
            URL="$ISSUE/$PR/comments"
          fi

          jq -Rs '{body: .}' <<< "$BODY" \
            | curl --fail-with-body -sS -o /dev/null -X "$METHOD" -d @- \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/json" \
                "$URL"

      - name: Gate on the visual-approved label
        if: steps.compare.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ISSUE="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues"

          # The label may only excuse screenshot differences. A build, Docker or
          # runner failure exits non-zero the same way, and waving those through
          # would turn the gate into decoration.
          if [[ ! -f apps/storybook/visual-results.json ]]; then
            echo "::error::The visual run failed before it produced a report — this is not a screenshot difference."
            exit 1
          fi

          VERDICT="$(node apps/storybook/scripts/visual-summary.mjs --verdict apps/storybook/visual-results.json)"

          # Baselines only ever come from the cache main publishes, so a story
          # added on a branch has nothing to be compared against and fails its
          # first run by writing the snapshot. That is not a regression, and no
          # label could describe it — merging is what takes the baseline.
          if [[ "$VERDICT" == "baselines-added" ]]; then
            echo "::notice::New stories wrote their first baselines; there was nothing to compare them against. Merging publishes the set from main."
            exit 0
          fi

          if [[ "$VERDICT" != "mismatch-only" ]]; then
            echo "::error::The visual run failed for reasons beyond changed screenshots. Read the log; the label does not apply."
            exit 1
          fi

          # Read live rather than off the event payload: "Re-run failed jobs"
          # replays the original payload, where a label added afterwards is
          # invisible.
          # The timeline is oldest-first, so the newest approval sits on the last
          # page — walk them rather than trusting page one.
          LABELLED_AT=""
          PAGE=1
          while [[ "$PAGE" -le 10 ]]; do
            CHUNK="$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$ISSUE/$PR/timeline?per_page=100&page=$PAGE")"

            MATCH="$(jq -r '[.[] | select(.event == "labeled" and .label.name == "visual-approved")] | last | .created_at // empty' <<< "$CHUNK")"
            if [[ -n "$MATCH" ]]; then
              LABELLED_AT="$MATCH"
            fi

            if [[ "$(jq 'length' <<< "$CHUNK")" -lt 100 ]]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done

          if [[ -z "$LABELLED_AT" ]]; then
            echo "::error::Stories render differently than on main. Review the visual-report artifact, apply the visual-approved label, then re-run this job."
            exit 1
          fi

          # And it has to post-date the commit under test, so an approval cannot
          # carry over from an earlier rendering if the reset workflow loses the
          # race against this one.
          COMMITTED_AT="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" \
            | jq -r '.commit.committer.date')"

          # Normalised to epoch seconds: a commit date can carry a timezone
          # offset while the label timestamp is UTC, and comparing those as
          # strings silently gets the order wrong.
          if [[ "$(date -u -d "$LABELLED_AT" +%s)" -lt "$(date -u -d "$COMMITTED_AT" +%s)" ]]; then
            echo "::error::visual-approved predates $HEAD_SHA — it approved an earlier rendering. Re-apply it and re-run this job."
            exit 1
          fi

          echo "::notice::Visual changes accepted via the visual-approved label."

  ci:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [guard, lint, typecheck, build-packages, build-apps, test, e2e, visual, chromatic]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Write summary
        run: |
          {
            echo "## CI Results"
            echo ""
            if [[ "${{ needs.guard.outputs.run }}" != "true" ]]; then
              echo "Release PR — pipeline skipped, every commit in it already passed on \`main\`."
              echo ""
            fi
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Lint              | ${{ needs.lint.result }} |"
            echo "| TypeScript        | ${{ needs.typecheck.result }} |"
            echo "| Unit Tests        | ${{ needs.test.result }} |"
            echo "| Build Packages    | ${{ needs.build-packages.result }} |"
            echo "| Build Apps        | ${{ needs.build-apps.result }} |"
            echo "| E2E Tests         | ${{ needs.e2e.result }} |"
            echo "| Visual Regression | ${{ needs.visual.result }} |"
            echo "| Publish Storybook | ${{ needs.chromatic.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify all jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more CI jobs failed or were cancelled."
          exit 1
