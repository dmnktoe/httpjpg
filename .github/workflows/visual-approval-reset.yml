name: Visual Approval Reset

# Drops the visual-approved label whenever the branch moves, so an approval
# granted for one rendering cannot silently cover a later one.
on:
  pull_request:
    types: [synchronize]

permissions:
  pull-requests: write

jobs:
  reset:
    name: Drop the approval
    if: contains(github.event.pull_request.labels.*.name, 'visual-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove visual-approved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          curl -sS -o /dev/null -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR/labels/visual-approved"
          echo "::notice::Dropped visual-approved — the branch moved, so the screenshots need looking at again."
